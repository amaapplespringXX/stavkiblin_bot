<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тотализатор</title>
<style>
  :root{
    --bg:#eef6f5;
    --card:#ffffff;
    --border:#d3e6e2;
    --text:#12403c;
    --muted:#5f807b;
    --teal:#0f766e;
    --teal-dark:#0b5d57;
    --teal-soft:#e2f2ef;
    --blue:#1e5f8f;
    --blue-soft:#e3eef7;
    --green:#118a5e;
    --green-soft:#e1f3ec;
    --danger:#9a3b3b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.5;
  }
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 60px}

  /* ---------- Dev-вход (вне Telegram) ---------- */
  .login-box{max-width:400px;margin:12vh auto 0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:32px 28px;text-align:center}
  .login-box h1{font-size:26px;color:var(--teal);letter-spacing:.5px;margin-bottom:6px}
  .login-box p{color:var(--muted);font-size:13.5px;margin-bottom:20px}
  .login-box input{width:100%;margin-bottom:12px}

  /* ---------- Общие элементы ---------- */
  input,select{
    font:inherit;color:var(--text);background:#fbfdfd;border:1px solid var(--border);
    border-radius:9px;padding:9px 12px;outline:none;
  }
  input:focus{border-color:var(--teal)}
  button{
    font:inherit;border:none;border-radius:9px;padding:9px 16px;cursor:pointer;
    background:var(--teal);color:#fff;font-weight:600;
  }
  button:hover{background:var(--teal-dark)}
  button:disabled{opacity:.45;cursor:default}
  button.ghost{background:transparent;color:var(--teal);border:1px solid var(--border);font-weight:500}
  button.ghost:hover{background:var(--teal-soft)}
  button.danger{background:var(--danger)}
  button.ghost-danger{background:transparent;color:var(--danger);border:1px solid var(--border);font-weight:500}
  button.ghost-danger:hover{background:#f7ecec}

  /* ---------- Шапка ---------- */
  header{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;
  }
  header .logo{font-size:19px;font-weight:700;color:var(--teal);letter-spacing:.4px}
  header .spacer{flex:1}
  .balance{
    background:var(--green-soft);color:var(--green);border-radius:999px;
    padding:5px 14px;font-weight:700;font-size:14px;white-space:nowrap;
  }
  .username{font-weight:600}

  /* ---------- Карточки пари ---------- */
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
  .card h3{font-size:17px;margin-bottom:2px}
  .meta{color:var(--muted);font-size:13px;margin-bottom:12px}
  .status{display:inline-block;border-radius:999px;padding:3px 12px;font-size:12.5px;font-weight:600;margin-bottom:10px}
  .st-open{background:var(--green-soft);color:var(--green)}
  .st-locked{background:var(--blue-soft);color:var(--blue)}
  .st-await{background:#e8f1f0;color:#3c6d68;border:1px dashed #9fc4bf}
  .st-done{background:#eceff1;color:#607471}

  .outcome{
    display:flex;align-items:center;gap:12px;border:1px solid var(--border);
    border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer;
  }
  .outcome:hover{border-color:var(--teal)}
  .outcome.sel{border-color:var(--teal);background:var(--teal-soft)}
  .outcome.win{border-color:var(--green);background:var(--green-soft)}
  .outcome.static{cursor:default}
  .outcome.static:hover{border-color:var(--border)}
  .outcome.win:hover{border-color:var(--green)}
  .o-name{flex:1;font-weight:500}
  .o-pool{color:var(--muted);font-size:13px;white-space:nowrap}
  .o-coef{font-weight:700;color:var(--blue);font-size:15px;min-width:52px;text-align:right}

  .betform{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
  .betform input{width:130px}
  .preview{font-size:13.5px;color:var(--muted);margin-top:8px;min-height:18px}
  .preview b{color:var(--green)}

  .mybets{margin-top:14px;border-top:1px solid var(--border);padding-top:10px;font-size:13.5px}
  .mybets div{margin-bottom:3px}
  .mybets .win-line{color:var(--green);font-weight:600}
  .mybets .lose-line{color:var(--muted)}

  .resultbox{margin-top:14px;border-top:1px solid var(--border);padding-top:12px}
  .resultbox p{font-size:13.5px;color:var(--muted);margin-bottom:8px}
  .confirmbar{display:flex;gap:10px;align-items:center;margin-top:10px;flex-wrap:wrap}

  .countdown{font-variant-numeric:tabular-nums}

  .toolbar{display:flex;align-items:center;margin-bottom:16px;gap:12px}
  .toolbar h2{font-size:16px;font-weight:600;flex:1}

  /* ---------- Форма создания ---------- */
  .createform label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  .createform input[type=text]{width:100%}
  .createform input[type=number]{width:140px}
  .outc-row{display:flex;gap:8px;margin-bottom:8px}
  .outc-row input{flex:1}
  .outc-row button{padding:6px 12px}
  .form-actions{margin-top:18px;display:flex;gap:10px}

  .empty{color:var(--muted);text-align:center;padding:36px 0;font-size:14px}

  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
    background:var(--text);color:#fff;border-radius:10px;padding:10px 18px;
    font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:90%;
    z-index:99;
  }
  #toast.show{opacity:.96}
</style>
</head>
<body>

<!-- DEV-ВХОД (показывается только вне Telegram) -->
<div id="view-login" class="wrap" style="display:none">
  <div class="login-box">
    <h1>Тотализатор</h1>
    <p>Dev-режим (открыто вне Telegram).<br>Введи имя, чтобы войти.<br>Новым игрокам начисляется <b>10 000 ТК</b> (Толикоины).</p>
    <input id="login-name" type="text" maxlength="24" placeholder="Твоё имя"
           onkeydown="if(event.key==='Enter')login()">
    <button style="width:100%" onclick="login()">Войти</button>
  </div>
</div>

<!-- ПРИЛОЖЕНИЕ -->
<div id="view-app" class="wrap" style="display:none">
  <header>
    <span class="logo">Тотализатор</span>
    <span class="spacer"></span>
    <span class="username" id="hdr-name"></span>
    <span class="balance" id="hdr-balance"></span>
    <button class="ghost" id="btn-logout" onclick="logout()" style="display:none">Выйти</button>
  </header>

  <div class="toolbar">
    <h2>Пари</h2>
    <button id="btn-new" onclick="toggleCreate()">Создать пари</button>
  </div>

  <!-- форма создания -->
  <div class="card createform" id="createform" style="display:none">
    <h3>Новое пари</h3>
    <label>Вопрос / название события</label>
    <input type="text" id="cf-title" maxlength="120" placeholder="Сколько Никита сегодня выбьет страйков?">
    <label>Исходы (минимум 2)</label>
    <div id="cf-outcomes"></div>
    <button class="ghost" onclick="addOutcomeField()">+ Добавить исход</button>
    <label>Время приёма ставок, минут</label>
    <input type="number" id="cf-betmin" min="1" step="1" value="10">
    <label>Длительность события, минут (не меньше времени ставок)</label>
    <input type="number" id="cf-evmin" min="1" step="1" value="60">
    <div class="form-actions">
      <button onclick="submitEvent()">Создать</button>
      <button class="ghost" onclick="toggleCreate()">Отмена</button>
    </div>
  </div>

  <div id="events"></div>
</div>

<div id="toast"></div>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="app.js"></script>
</body>
</html>
